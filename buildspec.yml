version: 0.2
phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws --version
      - AWS_ACCOUNT_ID="947792709243"
      - REPOSITORY_NAME="shiek-manual-ror-app"
      - SERVICE_NAME="shiek-manual-chat-app-ror-taskdefinition-service-5zh5f7rv"
      - CONTAINER_NAME="shiek-manual-chat-app-container"
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com
  build:
    commands:
      - echo "Purging all operational data from database..."
      - docker run --rm 947792709243.dkr.ecr.us-east-1.amazonaws.com/shiek-manual-ror-app:latest bundle exec rails runner "ActiveRecord::Base.connection.execute('SET FOREIGN_KEY_CHECKS = 0;'); Message.delete_all; Conversation.delete_all; User.delete_all; ActiveRecord::Base.connection.execute('SET FOREIGN_KEY_CHECKS = 1;')" || true
      - echo "Proceeding with standard build..."
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/${REPOSITORY_NAME}:latest
      - echo Writing image definitions file for ECS...
      - printf '[{"name":"%s","imageUri":"%s"}]' "${CONTAINER_NAME}" "${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/${REPOSITORY_NAME}:latest" > imagedefinitions.json
      - echo Build and configuration artifacts generation complete!
artifacts:
  files:
    - imagedefinitions.json
